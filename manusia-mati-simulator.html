<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manusia Mati Simulator</title>
  <style>
    canvas {
      background: #000;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="600" height="400"></canvas>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");const jumlahOrang = 100;
const radius = 5;
const jarakInfeksi = 10;
const chanceInfeksi = 0.1;
const chanceMati = 0.01; // dikurangi biar gak cepat mati
const waktuInfeksi = 600; // ditambah supaya bisa nyebar dulu

let orang = [];

class Manusia {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 2;
    this.vy = (Math.random() - 0.5) * 2;
    this.status = "sehat"; // sehat, infeksi, mati, sembuh
    this.timerInfeksi = 0;
  }

  update() {
    if (this.status !== "mati") {
      this.x += this.vx;
      this.y += this.vy;

      if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
      if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
    }

    if (this.status === "infeksi") {
      this.timerInfeksi++;

      if (Math.random() < chanceMati) {
        this.status = "mati";
      } else if (this.timerInfeksi > waktuInfeksi) {
        this.status = "sembuh";
      }
    }
  }

  draw() {
    if (this.status === "sehat") ctx.fillStyle = "white";
    if (this.status === "infeksi") ctx.fillStyle = "red";
    if (this.status === "mati") ctx.fillStyle = "gray";
    if (this.status === "sembuh") ctx.fillStyle = "green";
    ctx.beginPath();
    ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
    ctx.fill();
  }
}

for (let i = 0; i < jumlahOrang; i++) {
  let x = Math.random() * canvas.width;
  let y = Math.random() * canvas.height;
  let m = new Manusia(x, y);
  orang.push(m);
}

// Awal ada 1 yang kena infeksi
orang[0].status = "infeksi";

function update() {
  for (let i = 0; i < orang.length; i++) {
    orang[i].update();

    if (orang[i].status === "infeksi") {
      for (let j = 0; j < orang.length; j++) {
        if (orang[j].status === "sehat") {
          let dx = orang[i].x - orang[j].x;
          let dy = orang[i].y - orang[j].y;
          let dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < jarakInfeksi && Math.random() < chanceInfeksi) {
            orang[j].status = "infeksi";
          }
        }
      }
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let m of orang) {
    m.draw();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

  </script>
</body>
</html>
