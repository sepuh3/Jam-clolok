<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Manusia Mati Simulator</title>
  <style>
    body {
      background: #000;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }
    canvas {
      display: block;
      margin: 20px auto;
      background: #111;
    }
  </style>
</head>
<body>
  <h1>Manusia Mati Simulator</h1>
  <p>Merah = Terinfeksi, Abu = Mati, Hijau = Sehat</p>
  <canvas id="simulator" width="600" height="400"></canvas>
  <script>
    const canvas = document.getElementById("simulator");
    const ctx = canvas.getContext("2d");

    const jumlahOrang = 100;
    const radius = 5;
    const jarakInfeksi = 10;
    const chanceInfeksi = 0.1;
    const chanceMati = 0.05;
    const waktuInfeksi = 500;
    let orang = [];

    function buatOrang() {
      return {
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 2,
        vy: (Math.random() - 0.5) * 2,
        status: "sehat", // sehat, infeksi, mati
        timer: 0
      };
    }

    function resetSimulasi() {
      orang = [];
      for (let i = 0; i < jumlahOrang; i++) {
        orang.push(buatOrang());
      }
      // 1 orang pertama terinfeksi
      orang[0].status = "infeksi";
    }

    function update() {
      for (let o of orang) {
        if (o.status === "mati") continue;
        o.x += o.vx;
        o.y += o.vy;

        if (o.x < 0 || o.x > canvas.width) o.vx *= -1;
        if (o.y < 0 || o.y > canvas.height) o.vy *= -1;

        if (o.status === "infeksi") {
          o.timer++;
          if (Math.random() < chanceMati) {
            o.status = "mati";
          } else if (o.timer > waktuInfeksi) {
            o.status = "sehat"; // recovery
            o.timer = 0;
          }
        }

        for (let target of orang) {
          if (target === o || target.status !== "sehat") continue;
          let dx = o.x - target.x;
          let dy = o.y - target.y;
          let jarak = Math.sqrt(dx * dx + dy * dy);
          if (jarak < jarakInfeksi && o.status === "infeksi") {
            if (Math.random() < chanceInfeksi) {
              target.status = "infeksi";
              target.timer = 0;
            }
          }
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let o of orang) {
        if (o.status === "sehat") ctx.fillStyle = "lime";
        else if (o.status === "infeksi") ctx.fillStyle = "red";
        else ctx.fillStyle = "gray";

        ctx.beginPath();
        ctx.arc(o.x, o.y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    resetSimulasi();
    loop();
  </script>
</body>
  </html>
